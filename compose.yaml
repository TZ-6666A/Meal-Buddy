services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: fandazi
      POSTGRES_USER: fandazi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fandazi -d fandazi"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://fandazi:${POSTGRES_PASSWORD}@db:5432/fandazi
      # 让 uvicorn 采信反向代理（宿主机上的 Caddy）写入的 X-Forwarded-For。
      # 只信任 Docker 网桥和本机：外部直连 8000 时对端是公网地址，不会被信任。
      FORWARDED_ALLOW_IPS: 172.16.0.0/12,127.0.0.1,::1
    ports:
      # Only the host reverse proxy should reach the app; do not bypass HTTPS.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
